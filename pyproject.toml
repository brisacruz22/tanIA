[project]
name = "tania"
version = "0.1.0"
description = "TanIA: diagnóstico de cómo usas la IA para programar y qué dejas de aprender"
readme = "README.md"
authors = [
    { name = "Brisa C.", email = "121908266+brisacruz22@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "huggingface-hub>=2.4.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
tania = "tania:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
